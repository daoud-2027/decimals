function slotMinutes(s){
  var m = String(s||"").match(/(\d{1,2})\s*:\s*(\d{2})/);
  return m ? (parseInt(m[1],10)*60 + parseInt(m[2],10)) : 9999;
}

function sortTimetable(tt){
  if(!tt || !Array.isArray(tt.slots)) return;
  var days = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس"];
  var indexed = tt.slots.map(function(sl, i){ return { slot: sl, oldIdx: i, mins: slotMinutes(sl) }; });
  indexed.sort(function(a, b){ return a.mins - b.mins || a.oldIdx - b.oldIdx; });
  var newSlots = [];
  var newCells = {};
  indexed.forEach(function(item, newIdx){
    newSlots.push(item.slot);
    days.forEach(function(d){
      var oldKey = d + "_" + item.oldIdx;
      if(tt.cells && tt.cells[oldKey]){
        newCells[d + "_" + newIdx] = tt.cells[oldKey];
      }
    });
  });
  tt.slots = newSlots;
  tt.cells = newCells;
}

    '<p>نرحب بآرائكم ... واقترحاتكم ... واستفساراتكم ...<br><span style="font-weight:400;color:var(--mu);font-size:0.8rem">عبر هذا الرابط:</span></p>' +

async function getDeviceFingerprint(){
  try {
    var savedFp = localStorage.getItem(LOCAL_DEVICE_FP_KEY);
    if(savedFp && savedFp.length >= 12) return savedFp;
  } catch(e){}
  var raw = [
    navigator.userAgent || "",
    navigator.language || "",
    screen.colorDepth || "",
    Intl.DateTimeFormat().resolvedOptions().timeZone || "",
    navigator.hardwareConcurrency || "",
    navigator.platform || ""
  ].join("|");
  var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("dev_lic_fp_stable::" + raw));
  var fp = Array.from(new Uint8Array(buf)).slice(0, 10).map(function(b){return b.toString(16).padStart(2,"0")}).join("");
  try { localStorage.setItem(LOCAL_DEVICE_FP_KEY, fp); } catch(e){}
  return fp;
}

  return os + " (" + navigator.platform.slice(0, 12) + ")";
}

async function initCloud(){

        fbUser = cred.user;
      } else {

      }
    }
  } catch (e) {

  }

  try {
    var savedTeacherStr = localStorage.getItem(LOCAL_TEACHER_KEY);
    if(savedTeacherStr){
      var parsedT = JSON.parse(savedTeacherStr);
      if(parsedT && parsedT.licKey){

  } catch(e){}

}

async function save(){
  if(!currentTeacher || !ALL) return;
  if(db && fbUser){
    try {
      var ref = doc(db, 'artifacts', appId, 'public', 'data', 'teacher_licenses', currentTeacher.licKey);
      await setDoc(ref, {
        payload: JSON.stringify(ALL),
        updatedAt: Date.now()
      }, { merge: true });
    } catch (e) {
      console.error("Save error:", e);
    }
  }
}

function subscribeTeacherWorkspace(licKey){
  if(unsubscribeDoc){ unsubscribeDoc(); unsubscribeDoc = null; }
  if(!db || !fbUser){
    ALL = defaultData();
    S = ALL.secs[ALL.active];
    render();
    return;
  }
  var ref = doc(db, 'artifacts', appId, 'public', 'data', 'teacher_licenses', licKey);
  unsubscribeDoc = onSnapshot(ref, function(snap){
    if(snap.exists() && snap.data().payload){
      try {
        var parsed = JSON.parse(snap.data().payload);
        if(parsed && parsed.secs){
          ALL = parsed;
          ALL.appts = ALL.appts || [];
          if(!ALL.timetable || !ALL.timetable.slots) ALL.timetable = defaultTimetable();
          ALL.secs.forEach(function(sec){ sec.schedule = sec.schedule || {}; });
          S = ALL.secs[ALL.active] || ALL.secs[0];
          render();
          return;
        }
      } catch(e){}
    }
    if(!ALL){
      ALL = defaultData();
    }
    ALL.appts = ALL.appts || [];
    if(!ALL.timetable || !ALL.timetable.slots) ALL.timetable = defaultTimetable();
    ALL.secs.forEach(function(sec){ sec.schedule = sec.schedule || {}; });
    S = ALL.secs[ALL.active] || ALL.secs[0];
    save();
    render();
  }, function(err){
    console.error("Snapshot error:", err);
  });
}

async function handleAuthSubmit(){
  if(authBusy) return;
  authError = ""; authSuccess = "";

  if(!db || !fbUser){
    authError = "جاري الاتصال بالخادم، يرجى التأكد من اتصال الإنترنت والمحاولة بعد لحظة.";
    render(); return;
  }

  var licInput = (document.getElementById("au_lic")?.value || "").trim().toUpperCase();
  var nameInput = (document.getElementById("au_name")?.value || "").trim();
  var subjInput = (document.getElementById("au_subj")?.value || "").trim();

  if(licInput === DEV_ADMIN_PASSWORD){
    isAdminMode = true;
    authBusy = false;
    loadAdminKeys();
    render();
    return;
  }

  if(!licInput || licInput.length < 4){
    authError = "يرجى إدخال مفتاح الترخيص الصحيح المُستلم.";
    render(); return;
  }
  if(!nameInput || nameInput.length < 2){
    authError = "يرجى إدخال اسم الأستاذ(ة).";
    render(); return;
  }

  authBusy = true; render();
  var licKey = licInput.replace(/[^A-Z0-9\-]/g, "_");
  var registryRef = doc(db, 'artifacts', appId, 'public', 'data', 'license_registry', licKey);

  try {
    var snap = await getDoc(registryRef);
    var devFp = await getDeviceFingerprint();
    var devName = getDeviceLabel();
    var nowStr = new Date().toLocaleString("ar");

    if(!snap.exists()){
      authError = "مفتاح الترخيص غير صالح أو غير معتمد. تواصل مع المطور للحصول على مفتاح صالح.";
      authBusy = false;
      render();
      return;
    }

    var data = snap.data();
    var devices = data.devices || {};
    var deviceKeys = Object.keys(devices);

    var matchedFp = null;
    if(devices[devFp]){
      matchedFp = devFp;
    } else if(currentTeacher && currentTeacher.deviceFp && devices[currentTeacher.deviceFp]){
      matchedFp = currentTeacher.deviceFp;
    } else {
      for(var k=0; k<deviceKeys.length; k++){
        if(devices[deviceKeys[k]] === devName){
          matchedFp = deviceKeys[k];
          break;
        }
      }
    }

    if(matchedFp){
      if(matchedFp !== devFp){
        delete devices[matchedFp];
      }
      devices[devFp] = devName;
      try { localStorage.setItem(LOCAL_DEVICE_FP_KEY, devFp); } catch(e){}
      await setDoc(registryRef, { devices: devices, lastActive: nowStr, name: nameInput, subject: subjInput || data.subject }, { merge: true });

      currentTeacher = { licKey: licKey, name: nameInput, subject: subjInput || data.subject || "أستاذ التعليم المتوسط", deviceFp: devFp };
      localStorage.setItem(LOCAL_TEACHER_KEY, JSON.stringify(currentTeacher));
      subscribeTeacherWorkspace(licKey);
      view = "seat";
      toast("مرحباً بك، تم التحقق من جهازك الموثوق ✓");
    } else {
      if(deviceKeys.length >= 3){
        authError = "عذراً، وصل هذا المفتاح للحد الأقصى المسموح به وهو 3 أجهزة (" + deviceKeys.length + "/3). لا يمكن فتحه على جهاز رابع.";
        authBusy = false; render(); return;
      }

      devices[devFp] = devName;
      try { localStorage.setItem(LOCAL_DEVICE_FP_KEY, devFp); } catch(e){}
      await setDoc(registryRef, { devices: devices, lastActive: nowStr, name: nameInput, subject: subjInput || data.subject }, { merge: true });

      currentTeacher = { licKey: licKey, name: nameInput, subject: subjInput || data.subject || "أستاذ التعليم المتوسط", deviceFp: devFp };
      localStorage.setItem(LOCAL_TEACHER_KEY, JSON.stringify(currentTeacher));
      subscribeTeacherWorkspace(licKey);
      view = "seat";
      toast("تم تفعيل هذا الجهاز بنجاح (" + (deviceKeys.length + 1) + " من 3 أجهزة مسموحة) ✓");
    }
  } catch (err) {
    console.error(err);
    authError = "حدث خطأ أثناء الاتصال بالخادم. تحقق من اتصال الإنترنت.";
  }
  authBusy = false;
  render();
}

async function loadDevicesList(){

    var snap = await getDoc(licRef);

      var keys = Object.keys(devices);

      keys.forEach(function(fp){

function inp(k,l,s){return '<div><label>'+l+'</label><input type="number" min="0" max="20" step="0.25" value="'+(s.sc[k]===undefined?"":s.sc[k])+'" data-sc="'+k+'"></div>'}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var ed=iso(new Date());
function dayName(x){var d=new Date(x+"T12:00:00");return isNaN(d)?"":d.toLocaleDateString("ar",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function avgOf(s,k){var v=[],r=s.rec||{};for(var d in r)if(r[d][k]!==undefined)v.push(r[d][k]);return v.length?(v.reduce(function(a,b){return a+b},0)/v.length).toFixed(1):"—"}
var rf=(function(){var d=new Date();d.setDate(d.getDate()-30);return iso(d)})(),rt=iso(new Date());
var CR=[["part","المشاركة في القسم"],["hw","الواجبات المنزلية"],["ex","التمارين المنزلية"],["nb","تنظيم الكراس"],["hand","خط الكتابة"]],EX=[["diag","التقويم التشخيصي"],["f1","الفرض 1"],["f2","الفرض 2"],["f3","الفرض 3"],["t1","الاختبار 1"],["t2","الاختبار 2"],["t3","الاختبار 3"],["c1","التقييم المستمر 1"],["c2","التقييم المستمر 2"],["c3","التقييم المستمر 3"]];
function dts(s){return Object.keys(s.rec||{}).filter(function(d){return d>=rf&&d<=rt&&Object.keys(s.rec[d]).length}).sort()}
function avgIn(s,k,ds){var v=[];ds.forEach(function(d){if(s.rec[d][k]!==undefined)v.push(s.rec[d][k])});return v.length?(v.reduce(function(a,b){return a+b},0)/v.length).toFixed(1):"—"}
var SECC=["#2457c5","#8e3fa8","#0c8a7b","#d1631a"];
function col(v,m){var p=v/m;return p>=.7?"#1f9d6b":p>=.5?"#e0a21a":"#d64545"}
function bar(l,v,m){var n=parseFloat(v),w=isNaN(n)?0:Math.round(n/m*100);return '<div class="br"><span>'+l+'</span><span class="tr"><i style="width:'+w+'%;background:'+col(n,m)+'"></i></span><em>'+(isNaN(n)?"—":v)+'</em></div>'}
function mean(a){a=a.filter(function(x){return !isNaN(x)});return a.length?a.reduce(function(p,q){return p+q},0)/a.length:NaN}
function f1(x){return isNaN(x)?"—":x.toFixed(1)}
function gm(s,ds){return mean(CR.map(function(c){return parseFloat(avgIn(s,c[0],ds))}))}
function kp(a){return '<div class="kp">'+a.map(function(x){return '<div><b>'+x[1]+'</b><span>'+x[0]+'</span></div>'}).join("")+'</div>'}
function banner(t,sub){return '<div class="bn"><h2>'+t+'</h2><p>'+sub+'</p></div>'}

async function dl(name,data){
  try {
    var blob = new Blob([data], {type: "application/octet-stream"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast("تم التحميل بنجاح ✓");
  } catch(e){
    toast("تعذّر حفظ الملف");
  }
}

function book(sheets,name){
  var X = window.XLSX;
  if(!X) {
    window.print();
    return;
  }
  try {
    var w = X.utils.book_new();
    w.Workbook = {Views:[{RTL:true}]};
    sheets.forEach(function(p){
      var ws = X.utils.aoa_to_sheet(p[1]);
      X.utils.book_append_sheet(w, ws, p[0]);
    });
    var wbout = X.write(w, {bookType:"xlsx", type:"array"});
    dl(name, wbout);
  } catch(err){
    console.error(err);
    window.print();
  }
}

async function pdfx(name){
  var el = document.getElementById("rep");
  if(!el){ toast("لا يوجد تقرير لتصديره"); return; }
  
  if(!window.html2canvas || !window.jspdf){
    window.print();
    return;
  }
  
  try {
    toast("جاري تصدير ملف PDF...");
    var c = await html2canvas(el, {scale: 1.5, backgroundColor: "#ffffff", useCORS: true});
    var pdf = new jspdf.jsPDF("p", "mm", "a4");
    var m = 10, iw = 190;
    var pageHeight = 277;
    var imgHeight = c.height * iw / c.width;
    var heightLeft = imgHeight;
    var position = 0;

    var pageData = c.toDataURL("image/jpeg", 0.90);
    pdf.addImage(pageData, 'JPEG', m, m, iw, imgHeight);
    heightLeft -= pageHeight;

    while (heightLeft >= 0) {
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(pageData, 'JPEG', m, position + m, iw, imgHeight);
      heightLeft -= pageHeight;
    }
    pdf.save(name + ".pdf");
    toast("تم تصدير PDF بنجاح ✓");
  } catch(err){
    console.error(err);
    window.print();
  }
}

     '<div><label>أو كتابة التوقيت يدوياً</label><input type="text" id="sl_txt" dir="ltr" style="text-align:center" value="'+esc(curVal)+'" placeholder="08:00 - 08:55"></div>' +
     '<div class="row"><button class="pri" data-a="saveslot" data-i="'+sIdx+'" style="flex:1">حفظ التوقيت</button>' +
     (ALL.timetable.slots.length > 1 ? '<button class="dng" data-a="delslot" data-i="'+sIdx+'">حذف الحصة</button>' : '') +
     '<button data-a="close">إلغاء</button></div></div>');
   var fEl = document.getElementById("sl_from"), tEl = document.getElementById("sl_to"), txEl = document.getElementById("sl_txt");
   if(fEl && tEl && txEl){
     var sync = function(){ if(fEl.value && tEl.value) txEl.value = fEl.value + " - " + tEl.value; };
     fEl.addEventListener("change", sync); tEl.addEventListener("change", sync);
   }
 }
 else if(a==="saveslot"){
   var idx2 = +b.dataset.i;
   var nv = (document.getElementById("sl_txt")?.value || "").trim();
   if(nv){
     ALL.timetable.slots[idx2] = nv;
     sortTimetable(ALL.timetable);
     save(); modal(); render();
     toast("تم تحديث التوقيت وترتيب الحصص تسلسلياً ✓");
   }
 }
 else if(a==="delslot"){
   var idx3 = +b.dataset.i;
   ALL.timetable.slots.splice(idx3, 1);
   var newCells = {};
   ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس"].forEach(function(d){
     ALL.timetable.slots.forEach(function(_, newI){
       var oldI = newI >= idx3 ? newI + 1 : newI;
       if(ALL.timetable.cells[d+"_"+oldI]) newCells[d+"_"+newI] = ALL.timetable.cells[d+"_"+oldI];
     });
   });
   ALL.timetable.cells = newCells;
   sortTimetable(ALL.timetable);
   save(); modal(); render(); toast("تم حذف سطر التوقيت");
 }
 else if(a==="addslot"){
   ALL.timetable.slots.push("14:10 - 15:05");
   sortTimetable(ALL.timetable);
   save(); render(); toast("تمت إضافة سطر توقيت جديد ✓");
 }
 else if(a==="edcell"){
   if(!ttEdit){ toast("اضغط على زر 'تعديل الجدول' أولاً لتعديل الحصص"); return; }
   var day = b.dataset.d, cIdx = +b.dataset.i;
   var cKey = day + "_" + cIdx;
   var existing = (ALL.timetable.cells && ALL.timetable.cells[cKey]) || {sec: -1, type: ""};
   var presets = ["حصة عادية", "أعمال موجهة", "استقبال", "تطبيقات", "استدراك", "اجتماع / تنسيق", "راحة"];
   var hModal = '<h3>📚 تحديد الحصة ('+day+' • <span dir="ltr">'+esc(ALL.timetable.slots[cIdx])+'</span>)</h3><div class="f">';
   hModal += '<div><label>اختر القسم المعني</label><select id="cl_sec">';
   hModal += '<option value="-1"'+(existing.sec===-1?' selected':'')+'>— بدون قسم محدد (استقبال / راحة / نشاط آخر) —</option>';
   ALL.secs.forEach(function(sec, si){
     hModal += '<option value="'+si+'"'+(existing.sec===si?' selected':'')+'>'+esc(sec.name)+'</option>';
   });
   hModal += '</select></div>';
   hModal += '<div><label>نوع الحصة أو الملاحظة (اختياري)</label><input type="text" id="cl_type" value="'+esc(existing.type||"")+'" placeholder="مثال: حصة عادية، استقبال، راحة..."></div>';
   hModal += '<div class="row" style="gap:4px">' + presets.map(function(p){
     var isR = (p === "راحة");
     var btnStyle = isR ? 'padding:5px 10px;font-size:.72rem;border-radius:10px;background:color-mix(in srgb,#f2a516 20%,var(--sf));border-color:#d97706;color:#b45309;font-weight:700' : 'padding:5px 10px;font-size:.72rem;border-radius:10px';
     return '<button type="button" data-a="setpre" data-v="'+p+'" style="'+btnStyle+'">'+(isR?'☕ ':'')+p+'</button>';
   }).join("") + '</div>';
   hModal += '<div class="row" style="margin-top:8px"><button class="pri" data-a="savecell" data-d="'+day+'" data-i="'+cIdx+'" style="flex:1">حفظ الحصة</button>';
   hModal += '<button class="dng" data-a="clrcell" data-d="'+day+'" data-i="'+cIdx+'">تفريغ</button>';
   hModal += '<button data-a="close">إلغاء</button></div></div>';
   modal(hModal);
 }
 else if(a==="setpre"){
   var inpT = document.getElementById("cl_type");
   if(inpT) inpT.value = b.dataset.v;
   if(b.dataset.v === "راحة"){
     var selS = document.getElementById("cl_sec");
     if(selS) selS.value = "-1";
   }
 }
 else if(a==="savecell"){
   var d2 = b.dataset.d, i2 = +b.dataset.i;
   var secVal = parseInt(document.getElementById("cl_sec")?.value);
   var typeVal = (document.getElementById("cl_type")?.value || "").trim();
   ALL.timetable.cells = ALL.timetable.cells || {};
   if(secVal === -1 && !typeVal){
     delete ALL.timetable.cells[d2+"_"+i2];
   } else {
     ALL.timetable.cells[d2+"_"+i2] = {sec: secVal, type: typeVal};
   }
   save(); modal(); render(); toast("تم حفظ الحصة ✓");
 }
 else if(a==="clrcell"){
   var d3 = b.dataset.d, i3 = +b.dataset.i;
   if(ALL.timetable.cells) delete ALL.timetable.cells[d3+"_"+i3];
   save(); modal(); render(); toast("تم تفريغ الحصة");
 }
});

document.addEventListener("change",function(e){
 var t=e.target;
 if(!currentTeacher || !ALL) return;
 if(t.id==="ed"){if(t.value){ed=t.value;render()}}
 else if(t.id==="dn"){var s2=get(cur);s2.rec=s2.rec||{};var q=s2.rec[ed]=s2.rec[ed]||{};if(t.value.trim())q.note=t.value.trim();else delete q.note;save()}
 else if(t.id==="rf"||t.id==="rt"){if(t.value){if(t.id==="rf")rf=t.value;else rt=t.value;render()}}
 else if(t.dataset.sc){var v=parseFloat(t.value);get(cur).sc[t.dataset.sc]=isNaN(v)?"":Math.min(20,Math.max(0,v));save();render()}
 else if(t.dataset.g){var n=Math.min(t.dataset.g==="rows"?10:8,Math.max(1,parseInt(t.value)||1));var r=t.dataset.g==="rows"?n:S.rows,c=t.dataset.g === "cols"?n:S.cols;
  S.students.forEach(function(s){if(s.seat!==null&&s.seat>=r*c)s.seat=null});S[t.dataset.g]=n;save();render()}
});

initCloud();
</script>
