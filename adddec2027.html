<body>
<div class="wrap">

<div class="glass tgc"><div class="tgt">💬 نرحب بآرائكم ... واقتراحاتكم ... واستفساراتكم ...</div><div style="color:var(--mu);font-size:17px;margin-top:6px">عبر هذا الرابط:</div><a class="tg" href="https://t.me/Daoudk" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg><span style="direction:ltr">t.me/Daoudk</span></a></div>
<footer>© جميع الحقوق محفوظة للأستاذ كحول داود</footer>

<script>
const $=id=>document.getElementById(id),E=x=>`<span class="eq">${x}</span>`;
const NM=['الوحدات','العشرات','المئات','الآلاف'],FM=['','الأجزاء من عشرة','الأجزاء من مئة','الأجزاء من ألف'];
let N,OP,mI,mF,L,RS,ST,CR,LEAD,LZ,SW,S={};
const sy=()=>OP=='*'?'×':OP=='+'?'+':'−',sw=()=>OP=='*'?'جداء':OP=='+'?'مجموع':'فرق';
function parse(t){t=String(t).trim().replace(',','.');if(!/^\d{1,4}(\.\d{1,3})?$/.test(t))return null;const[i,f='']=t.split('.');return{ip:String(+i),fp:f}}
const fd=x=>x.ip+(x.fp?','+x.fp:''),sc=x=>+x.ip*1000+ +x.fp.padEnd(3,'0'),nat=x=>+(x.ip+x.fp);
const nz=s=>String(s).trim().replace('.',',').replace(/(,\d*?)0+$/,'$1').replace(/,$/,'');
const mc=(p,d)=>{const s=String(p).padStart(d+1,'0');return d?s.slice(0,-d)+','+s.slice(-d):s};
const fx3=n=>{const i=Math.floor(n/1000),f=String(n%1000).padStart(3,'0').replace(/0+$/,'');return f?i+','+f:''+i};
function say(t,bad){const e=$('teacher');e.innerHTML='<span class="av">👨‍🏫</span><p>'+t+'</p>';e.classList.toggle('badm',!!bad);e.classList.remove('fade');void e.offsetWidth;e.classList.add('fade')}
function shake(e){e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake')}
function show(v){['home','work'].forEach(x=>$(x).classList.toggle('hidden',x!==v))}
function reset(){['rows','calc','ctl','final'].forEach(x=>$(x).innerHTML='')}
function calc(keys,res,note){const d=i=>`style="animation-delay:${i*.28}s"`;
$('calc').innerHTML=`<div class="calc"><div class="head">🧮 بالآلة الحاسبة</div><div class="keys">${keys.map((k,i)=>`<span class="key fade ${/^[+−×=]$/.test(k)?'o2':''}" ${d(i)}>${k}</span>`).join('')}</div><div class="lcd fade" ${d(keys.length)}>${res}</div><div class="cnote fade" ${d(keys.length+1)}>${note}</div></div>`}
let SK=0;
function nx(label){return new Promise(r=>{$('ctl').innerHTML=`<div class="btns" style="margin:0"><button class="btn fade" id="nx">${label}</button><button class="btn ghost" id="sk">تخطّي الشرح ⏩</button></div>`;$('nx').onclick=()=>{$('ctl').innerHTML='';r()};$('sk').onclick=()=>{SK=1;$('ctl').innerHTML='';r()}})}
async function wt(l){if(!SK)await nx(l)}
function mkInp(id){const e=$(id);e.classList.remove('empty');e.innerHTML='<input inputmode="decimal" autocomplete="off">';const i=e.firstChild;i.oninput=()=>i.value=i.value.replace(/[^\d.,]/g,'').slice(0,14);i.onkeydown=ev=>{if(ev.key==='Enter'&&$('chk'))$('chk').click()};return i}
function ask(id,test,hint,done){const inp=mkInp(id);inp.focus();$('ctl').innerHTML='<div class="btns" style="margin:0"><button class="btn" id="chk">تحقق ✔</button></div>';
$('chk').onclick=()=>{if(test(inp.value))done(inp.value);else{inp.classList.add('no');shake(inp);say(hint,1)}}}
const addRow=h=>$('rows').insertAdjacentHTML('beforeend',`<div class="row fade">${h}</div>`);

/* ---------- جمع وطرح: الحساب العمودي ---------- */
function lay(){const[x,y]=N;mI=Math.max(x.ip.length,y.ip.length);mF=Math.max(x.fp.length,y.fp.length);L=mI+mF}
function dgt(x,j){if(j<mI){const i=j-(mI-x.ip.length);return i>=0?x.ip[i]:null}const k=j-mI;return k<x.fp.length?x.fp[k]:'0'}
function comp(){const[x,y]=N;let c=0;RS=[];ST=[];CR=[];
for(let j=L-1;j>=0;j--){const a=+(dgt(x,j)||0),b=+(dgt(y,j)||0);
if(OP=='+'){const s=a+b+c;RS[j]=s%10;CR[j]=s>9?1:0;ST[j]=[a,b,c,s]}else{const bb=b+c;let t=a,k=0;if(t<bb){t+=10;k=1}RS[j]=t-bb;CR[j]=k;ST[j]=[a,b,c,t,bb]}c=CR[j]}
LEAD=c;LZ=RS.map((v,j)=>j<mI-1&&!LEAD&&RS.slice(0,j+1).every(z=>z==0))}
const cname=j=>{const p=j-(mI-1);return p>0?FM[p]:NM[-p]};
function row(p,s){let h=`<div class="gr${p=='C'||p=='D'?' cr':''}"><span class="sg">${s||''}</span><span class="gc" id="${p}L"></span>`;for(let j=0;j<L;j++){h+=`<span class="gc" id="${p}${j}"></span>`;if(j==mI-1&&mF>0)h+=`<span class="gc cm" id="${p}k"></span>`}return h+'</div>'}
function grid(){$('rows').innerHTML=`<div class="grid" style="--cols:${L+2}">${row('C')}${row('A')}${row('B',sy())}${OP=='-'?row('D'):''}<div class="ln"></div>${row('R')}</div>`}
function set(id,t,c){const e=$(id);if(!e)return;e.textContent=t;if(c)e.className+=' '+c}
function putNums(pad){[['A',N[0]],['B',N[1]]].forEach(([p,x])=>{for(let j=0;j<L;j++){const c=dgt(x,j),pz=j>=mI&&j-mI>=x.fp.length;if(c!==null&&(!pz||pad))set(p+j,c,pz?'padz glow':'')}
if(mF>0&&(x.fp.length>0||pad))set(p+'k',',',pad&&!x.fp.length?'glow':'')})}
function hlcol(j){document.querySelectorAll('.cur').forEach(e=>e.classList.remove('cur'));['A','B','R','C'].forEach(p=>{const e=$(p+j);e&&e.classList.add('cur')})}
function mark(j){if(OP=='+'){if(CR[j]){if(j>0)set('C'+(j-1),'1','cy');else set('RL','1','ok glow')}}else if(CR[j]){set('C'+j,'+10','cy');if(j>0)set('D'+(j-1),'+1','cy')}}
function fmtRes(){let ip;if(LEAD)ip='1'+RS.slice(0,mI).join('');else ip=RS.slice(0,mI).join('').replace(/^0+(?=\d)/,'');const fp=RS.slice(mI).join('');return fp?ip+','+fp:ip}
function colMsg(j){const[a,b,c,s,bb]=ST[j],n=cname(j);let m;
if(OP=='+')m=`عمود ${n}: ${E(a+' + '+b+(c?' + '+c:'')+' = '+s)}`+(s>9?`. نكتب ${E(s%10)} ونحتفظ بـ ${E(1)} للعمود الموالي${j?'':' (فنكتبه في النتيجة)'}.`:`. نكتب ${E(s)}.`);
else m=CR[j]?`عمود ${n}: العلوي ${a} أصغر من ${bb}${c?` (${b} + ${c} احتفاظ)`:''}، فنضيف 10 للرقم العلوي ليصبح ${a+10}، ونضيف 1 للرقم السفلي في العمود الموالي: ${E((a+10)+' − '+bb+' = '+RS[j])}.`:`عمود ${n}: ${E(a+' − '+bb+' = '+RS[j])}${c?` (حيث ${bb} = ${b} + ${c})`:''}.`;
